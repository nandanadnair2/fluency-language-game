<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360, initial-scale=1.0">
  <title>LinguaScout</title>
  <style>
    /* ---- Cozy Warm Palette ---- */
    :root {
      --cream:       #FDF6EC;
      --coral:       #E8735A;
      --coral-dark:  #C95A42;
      --sage:        #8BA888;
      --sage-dark:   #6B8B68;
      --warm-gray:   #A89F91;
      --charcoal:    #3D3832;
      --card-bg:     #FFFCF7;
      --shadow:      rgba(61, 56, 50, 0.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      min-height: 320px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
      padding: 18px 20px 14px;
      border-radius: 0 0 16px 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .header p {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      margin-top: 2px;
    }

    /* Main content */
    .content {
      padding: 0 20px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Room Code Section */
    .room-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .room-section label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--warm-gray);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    .room-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #EDE5D8;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 6px;
      color: var(--charcoal);
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    .room-input::placeholder {
      letter-spacing: 2px;
      font-weight: 400;
      font-size: 14px;
      color: #C9C0B3;
    }
    .room-input:focus {
      border-color: var(--coral);
    }
    .connect-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--sage);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .connect-btn:hover { background: var(--sage-dark); }
    .connect-btn:active { transform: scale(0.97); }
    .connect-btn.connected {
      background: var(--coral);
    }
    .connect-btn.connected:hover {
      background: var(--coral-dark);
    }

    /* Status */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #D4CFC7;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .status-dot.connected {
      background: var(--sage);
      box-shadow: 0 0 6px rgba(139, 168, 136, 0.5);
    }
    .status-dot.error {
      background: var(--coral);
      box-shadow: 0 0 6px rgba(232, 115, 90, 0.4);
    }
    .status-text {
      color: var(--warm-gray);
    }

    /* Subtitle Preview */
    .subtitle-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px var(--shadow);
      flex: 1;
      min-height: 80px;
    }
    .subtitle-section .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--warm-gray);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .subtitle-preview {
      font-size: 14px;
      line-height: 1.5;
      color: var(--charcoal);
      min-height: 42px;
      display: flex;
      align-items: center;
    }
    .subtitle-preview.empty {
      color: #C9C0B3;
      font-style: italic;
      font-size: 13px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 10px 20px 14px;
      font-size: 11px;
      color: var(--warm-gray);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌿 LinguaScout</h1>
    <p>Subtitle sync for language learners</p>
  </div>

  <div class="content">
    <!-- Room Code -->
    <div class="room-section">
      <label for="roomCode">Room Code</label>
      <div class="input-row">
        <input
          type="text"
          id="roomCode"
          class="room-input"
          maxlength="4"
          placeholder="0000"
          autocomplete="off"
        />
        <button id="connectBtn" class="connect-btn">Connect</button>
      </div>
    </div>

    <!-- Status -->
    <div class="status-bar">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText" class="status-text">Not connected</span>
    </div>

    <!-- Subtitle Preview -->
    <div class="subtitle-section">
      <div class="section-label">Latest Subtitle</div>
      <div id="subtitlePreview" class="subtitle-preview empty">
        Waiting for subtitles…
      </div>
    </div>
  </div>

  <div class="footer">
    Open YouTube or Netflix, enable captions, and connect to a room.
  </div>

  <script src="popup.js"></script>
</body>
</html>
