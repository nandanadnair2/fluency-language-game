<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Speech bubble / bird body -->
  <rect x="15" y="25" width="65" height="55" rx="12" fill="#E56515"/>
  <!-- Speech bubble tail -->
  <polygon points="75,70 85,85 65,75" fill="#E56515"/>
  <!-- Eyes -->
  <circle cx="35" cy="48" r="4" fill="#2D2A24"/>
  <circle cx="58" cy="48" r="4" fill="#2D2A24"/>
  <!-- Beak -->
  <polygon points="44,58 52,58 48,68" fill="#FBA45C"/>
  <!-- Graduation cap board -->
  <polygon points="50,18 75,28 50,38 25,28" fill="#919599"/>
  <!-- Graduation cap base -->
  <rect x="35" y="35" width="30" height="8" rx="2" fill="#CDCDCB"/>
  <!-- Tassel string -->
  <line x1="50" y1="28" x2="50" y2="43" stroke="#E56515" stroke-width="2"/>
  <!-- Tassel end -->
  <circle cx="50" cy="45" r="3" fill="#FBA45C"/>
</svg>
